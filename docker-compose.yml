# Stack de Trazo. Base común a todos los entornos; el override local y el de producción solo agregan lo que cambia.
# Documentado en docs/operacion/docker.md
name: trazo

x-laravel: &laravel
  image: trazo/api:${TRAZO_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  environment: &laravel-env
    APP_NAME: Trazo
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL:-http://localhost:8088}
    APP_KEY: ${APP_KEY:-}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-trazo}
    DB_USERNAME: ${DB_USERNAME:-trazo}
    DB_PASSWORD: ${DB_PASSWORD:-trazo_local_only}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:-trazo_local_only}
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: array
    SESSION_MAX_MINUTES: ${SESSION_MAX_MINUTES:-480}
    SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
    SEED_INCIDENTS: ${SEED_INCIDENTS:-600}
    # Juegos de cuentas por rol (también en producción). Vacíos: no se crean
    EVALUATION_EMAIL_PATTERN: ${EVALUATION_EMAIL_PATTERN:-}
    EVALUATION_PASSWORD: ${EVALUATION_PASSWORD:-}
    OWNER_LABEL: ${OWNER_LABEL:-Daniel Naranjo}
    OWNER_EMAIL_PATTERN: ${OWNER_EMAIL_PATTERN:-}
    OWNER_PASSWORD: ${OWNER_PASSWORD:-}
    INCIDENT_CODE_PREFIX: ${INCIDENT_CODE_PREFIX:-TZ}
    API_RATE_LIMIT: ${API_RATE_LIMIT:-120}
    SYSTEM_EVENTS_RETENTION_DAYS: ${SYSTEM_EVENTS_RETENTION_DAYS:-90}
    NOTIFICATIONS_RETENTION_DAYS: ${NOTIFICATIONS_RETENTION_DAYS:-90}
    # Tiempo real: la app le habla a Reverb por la red interna; el navegador llega por el gateway en /ws
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: ${REVERB_APP_ID:-trazo}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-trazo-local-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-trazo_local_only}
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-localhost}
    MAIL_MAILER: smtp
    MAIL_HOST: ${MAIL_HOST:-mailpit}
    MAIL_PORT: ${MAIL_PORT:-1025}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@trazo.local}
    MAIL_FROM_NAME: Trazo
  volumes:
    - app-key:/run/trazo
  networks: [edge, data]
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4.11
    # Configuración como parámetros: MySQL ignora archivos .cnf montados con permisos amplios (Windows/macOS)
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --skip-name-resolve
      - --slow-query-log=1
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=1
      - --innodb-ft-min-token-size=3
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-trazo}
      MYSQL_USER: ${DB_USERNAME:-trazo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-trazo_local_only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-trazo_root_local_only}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [data]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  # Respaldo diario de la base con la misma imagen de MySQL: volcado sin bloquear la app, comprimido y cifrado.
  # Usa el usuario de la app (no root) y solo la red interna. Documentado en docs/operacion/respaldos.md
  backup:
    image: mysql:8.4.11
    entrypoint: ["bash", "/usr/local/bin/trazo-backup"]
    command: ["schedule"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-trazo}
      DB_USERNAME: ${DB_USERNAME:-trazo}
      DB_PASSWORD: ${DB_PASSWORD:-trazo_local_only}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-America/Bogota}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./docker/mysql/backup.sh:/usr/local/bin/trazo-backup:ro
      - backups:/backups
      - backup-key:/run/backup-key
    depends_on:
      mysql: { condition: service_healthy }
    # Sano mientras el último respaldo tenga menos de 26 horas; al arrancar sin respaldo reciente hace uno
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/trazo-backup", "check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10m
    networks: [data]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  redis:
    image: redis:8.10.3-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-trazo_local_only}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-trazo_local_only}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # Se ejecuta una vez antes de la API: migraciones y seeders (idempotentes, se pueden repetir)
  init:
    <<: *laravel
    command: ["php", "artisan", "migrate", "--force", "--seed"]
    restart: "no"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  app:
    <<: *laravel
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "fpm-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  worker:
    <<: *laravel
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    depends_on:
      init: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  scheduler:
    <<: *laravel
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      init: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 192M }

  # Websockets del tiempo real. Sin puerto publicado: solo se llega por el gateway en /ws
  reverb:
    <<: *laravel
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  frontend:
    image: trazo/web:${TRAZO_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: prod
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [edge]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  gateway:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    ports:
      - "${TRAZO_HTTP_PORT:-8088}:8080"
    volumes:
      - ./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/upstream.prod.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      app: { condition: service_healthy }
      frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [edge]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

networks:
  edge: {}
  # MySQL y Redis viven en una red interna, sin salida ni puertos publicados
  data:
    internal: true

volumes:
  mysql-data: {}
  redis-data: {}
  app-key: {}
  backups: {}
  backup-key: {}
