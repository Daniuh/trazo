# Stack de Trazo. Base común a todos los entornos; el override local y el de producción solo agregan lo que cambia.
# Documentado en docs/operacion/docker.md
name: trazo

x-laravel: &laravel
  image: trazo/api:${TRAZO_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  environment: &laravel-env
    APP_NAME: Trazo
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL:-http://localhost:8088}
    APP_KEY: ${APP_KEY:-}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-trazo}
    DB_USERNAME: ${DB_USERNAME:-trazo}
    DB_PASSWORD: ${DB_PASSWORD:-trazo_local_only}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:-trazo_local_only}
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: array
    SESSION_MAX_MINUTES: ${SESSION_MAX_MINUTES:-480}
    SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
    SEED_INCIDENTS: ${SEED_INCIDENTS:-600}
    BROADCAST_CONNECTION: log
    MAIL_MAILER: smtp
    MAIL_HOST: ${MAIL_HOST:-mailpit}
    MAIL_PORT: ${MAIL_PORT:-1025}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@trazo.local}
    MAIL_FROM_NAME: Trazo
  volumes:
    - app-key:/run/trazo
  networks: [edge, data]
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4.11
    # Configuración como parámetros: MySQL ignora archivos .cnf montados con permisos amplios (Windows/macOS)
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --skip-name-resolve
      - --slow-query-log=1
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=1
      - --innodb-ft-min-token-size=3
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-trazo}
      MYSQL_USER: ${DB_USERNAME:-trazo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-trazo_local_only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-trazo_root_local_only}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [data]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  redis:
    image: redis:8.4.7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-trazo_local_only}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-trazo_local_only}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # Se ejecuta una vez antes de la API: migraciones y seeders (idempotentes, se pueden repetir)
  init:
    <<: *laravel
    command: ["php", "artisan", "migrate", "--force", "--seed"]
    restart: "no"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  app:
    <<: *laravel
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "fpm-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  worker:
    <<: *laravel
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    depends_on:
      init: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  scheduler:
    <<: *laravel
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      init: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 192M }

  frontend:
    image: trazo/web:${TRAZO_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: prod
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [edge]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  gateway:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    ports:
      - "${TRAZO_HTTP_PORT:-8088}:8080"
    volumes:
      - ./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/upstream.prod.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      app: { condition: service_healthy }
      frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [edge]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

networks:
  edge: {}
  # MySQL y Redis viven en una red interna, sin salida ni puertos publicados
  data:
    internal: true

volumes:
  mysql-data: {}
  redis-data: {}
  app-key: {}
