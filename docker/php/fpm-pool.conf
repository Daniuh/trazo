; Pool de PHP-FPM. El contenedor corre sin root, así que no se definen user ni group.
[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
listen = 9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Usado solo por el healthcheck interno; el gateway no expone estas rutas
ping.path = /fpm-ping
pm.status_path = /fpm-status

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
