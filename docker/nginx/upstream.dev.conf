# Upstream del frontend en local: servidor de desarrollo de Vite.
# "resolve" vuelve a consultar el DNS de Docker si el contenedor se recrea con otra IP.
upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:5173 resolve;
}

# CSP en local: Vite inyecta los estilos con JavaScript (etiquetas <style>), así que solo aquí se permiten estilos en
# línea. Los scripts siguen igual de estrictos que en producción. Documentado en docs/seguridad/cabeceras.md
map "" $csp_style_src {
    default "'self' 'unsafe-inline'";
}

# En local no hay HTTPS: sin HSTS
map "" $hsts_header {
    default "";
}
