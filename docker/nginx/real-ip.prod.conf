# IP real de quien visita, en producción. El proxy de TLS (Caddy) llega por la red trazo-proxy y deja la IP del
# visitante en X-Forwarded-For; solo se le cree a esa red. Así los límites por IP (login, recuperación) cuentan a
# cada persona y no al proxy. Solo lo monta docker-compose.prod.yml. Documentado en docs/operacion/despliegue.md
set_real_ip_from 172.30.250.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
