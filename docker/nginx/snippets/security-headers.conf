# Cabeceras de seguridad comunes a todas las respuestas del gateway. Lo que cambia entre local y producción
# ($csp_style_src y $hsts_header) se define en upstream.dev.conf y upstream.prod.conf. Documentado en docs/seguridad/cabeceras.md
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Solo recursos del propio origen; sin scripts en línea ni eval; nadie puede mostrar la app dentro de otra página.
# connect-src 'self' incluye el websocket del tiempo real (/ws), que va por el mismo origen
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src $csp_style_src; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'" always;

# Vacía en local y en HTTP: nginx no envía una cabecera sin valor
add_header Strict-Transport-Security $hsts_header always;
