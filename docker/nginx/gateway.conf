# Gateway: única entrada pública. Enruta la API a PHP-FPM y todo lo demás al frontend.
# Documentado en docs/operacion/docker.md

server_tokens off;
client_max_body_size 8m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;

    # Salud del propio gateway
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API y salud de Laravel: siempre pasan por el front controller
    location ~ ^/(api|up)(/|$) {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    # Las rutas internas de PHP-FPM nunca se exponen
    location ~ ^/fpm- {
        return 404;
    }

    # SPA (en local apunta al servidor de Vite, con recarga en caliente)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
