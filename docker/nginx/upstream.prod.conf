# Upstream del frontend compilado (imagen de producción).
# "resolve" vuelve a consultar el DNS de Docker si el contenedor se recrea con otra IP.
upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:8080 resolve;
}

# CSP del build: los estilos salen en archivos .css, sin nada en línea. Documentado en docs/seguridad/cabeceras.md
map "" $csp_style_src {
    default "'self'";
}

# HSTS solo cuando la petición llegó por HTTPS (el proxy de TLS lo indica en X-Forwarded-Proto). Dos años, con
# subdominios: daniuh.dev ya exige HTTPS por estar en la lista de precarga
map $http_x_forwarded_proto $hsts_header {
    https   "max-age=63072000; includeSubDomains";
    default "";
}
